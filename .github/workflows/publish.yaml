name: Test & Release

on:
  release:
    types: [published]

  # Manual runs build and test the full matrix but never publish: see the `if` on the
  # publish jobs. This is how a change to the release pipeline gets exercised without
  # cutting a release.
  workflow_dispatch:

  # A PR that touches this file runs the whole build + test matrix, so changes to the
  # release pipeline (new targets, new interpreters) are validated on the PR rather
  # than discovered during a release. Publishing stays gated on the release event.
  pull_request:
    paths:
      - '.github/workflows/publish.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  # Interpreters we build a wheel for. Not abi3, so this is one wheel per version.
  PYTHON_VERSIONS: "3.10 3.11 3.12 3.13 3.14"

jobs:
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The from-sdist build compiles the extension cold. This is the path Alpine and any
    # other platform without a wheel takes today, so it is worth proving on every run.
    timeout-minutes: 45
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after a couple of runs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10'

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "stable"

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # 7.0.1
        with:
          name: wheels-sdist
          path: dist
          if-no-files-found: error

      - name: Check sdist metadata
        run: |
          ls -lh dist
          python -m pip install --upgrade pip twine
          python -m twine check --strict dist/*

      - name: Build and import from the sdist
        run: |
          python -m venv .venv-sdist
          . .venv-sdist/bin/activate

          # --no-binary tantivy: refuse any wheel for this name, so the tarball is what
          # gets built. This runs maturin under PEP 517 build isolation, the same path a
          # user on a platform with no wheel takes.
          python -m pip install --upgrade pip
          python -m pip install --no-binary tantivy dist/*.tar.gz

          # Import from a directory that is not the repo root: ./tantivy would shadow the
          # installed package.
          cd "$RUNNER_TEMP"
          python -c "import tantivy; print(tantivy.__file__)"

  build-wheel:
    name: Wheels - ${{ matrix.platform }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'x86_64-unknown-linux-gnu'
            manylinux: auto
          - platform: 'aarch64-unknown-linux-gnu'
            manylinux: auto
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            astral.sh:443
            cdn.quay.io:443
            cdn01.quay.io:443
            cdn02.quay.io:443
            cdn03.quay.io:443
            crates.io:443
            files.pythonhosted.org:443
            ghcr.io:443
            github.com:443
            index.crates.io:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            quay.io:443
            sh.rustup.rs:443
            static.crates.io:443
            static.rust-lang.org:443
            uploads.github.com:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10'
          architecture: x64

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          manylinux: ${{ matrix.manylinux }}
          target: ${{ matrix.platform }}
          command: build
          # --locked: build the dependency versions in Cargo.lock, not whatever resolves today.
          args: --release --locked -o dist -i ${{ env.PYTHON_VERSIONS }}

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # 7.0.1
        with:
          name: wheels-linux-${{ matrix.platform }}
          path: dist
          if-no-files-found: error

      - name: Check wheel metadata
        run: |
          ls -lh dist
          python -m pip install --upgrade pip twine
          python -m twine check --strict dist/*

  windows:
    name: Wheels - windows-${{ matrix.python-version }}-${{ matrix.target }}
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [x64]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        env:
          PYO3_PYTHON: python${{ matrix.python-version }}
        with:
          command: build
          args: --release --locked -o dist

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # 7.0.1
        with:
          name: wheels-windows-${{ matrix.python-version }}-${{ matrix.target }}
          path: dist
          if-no-files-found: error

      - name: Check wheel metadata
        shell: bash
        run: |
          ls -lh dist
          python -m pip install --upgrade pip twine
          python -m twine check --strict dist/*

  macos:
    name: Wheels - macos-${{ matrix.python-version }}-${{ matrix.target }}
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        target: ['universal2', 'x86_64-apple-darwin']
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheels - ${{ matrix.target }}
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        env:
          PYO3_PYTHON: python${{ matrix.python-version }}
        with:
          target: ${{ matrix.target }}
          command: build
          args: --release --locked -o dist

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # 7.0.1
        with:
          name: wheels-macos-${{ matrix.python-version }}-${{ matrix.target }}
          path: dist
          if-no-files-found: error

      - name: Check wheel metadata
        run: |
          ls -lh dist
          python -m pip install --upgrade pip twine
          python -m twine check --strict dist/*

  test-wheel:
    name: Test wheel - ${{ matrix.runner }} - ${{ matrix.python-version }}
    needs: [ build-wheel, windows, macos ]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Every wheel this workflow publishes is installed and exercised on a machine
        # that matches its tags. The wheels are per-interpreter, not abi3, so each
        # Python version is a different artifact and needs its own run.
        runner:
          - ubuntu-latest      # manylinux x86_64
          - ubuntu-24.04-arm   # manylinux aarch64
          - macos-latest       # macOS arm64 (universal2)
          - macos-15-intel     # macOS x86_64
          - windows-latest     # windows x64
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    defaults:
      run:
        shell: bash
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after a couple of runs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download all wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Install the wheel
        run: |
          ls dist

          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

          # --no-index: a missing wheel for this platform is an error, never a silent
          # fall back to building the sdist. --no-deps: dependencies came from the line
          # above, this line must resolve to a local file.
          python -m pip install \
            --no-index --no-deps --force-reinstall --find-links dist tantivy

      - name: Run the test suite against the wheel
        run: |
          # Run outside the repo root. ./tantivy is a package directory in the checkout
          # and would shadow the installed wheel, so a test run from here would exercise
          # the source tree and pass even if the wheel were broken. tests/test_docs.py
          # resolves docs/ relative to the working directory, so that comes too.
          mkdir -p ../wheel-test
          cp -r tests docs ../wheel-test/
          cd ../wheel-test

          python -c "import tantivy; print(tantivy.__file__); print(tantivy.__doc__)"
          python -m pytest tests --doctest-modules -q

  python-release-github:
    name: Attach wheels to the GitHub release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [ test-wheel, build-sdist ]
    permissions:
      contents: write # To add assets to a release.
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.1.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            uploads.github.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: wheels
          pattern: wheels-*
          merge-multiple: true

      - name: Upload release binaries
        uses: alexellis/upload-assets@d8de0b9b956cfb3d7633afdb66ef24c36940a9f7 # 0.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          asset_paths: '["./wheels/tantivy-*"]'

  release-pypy:
    name: Release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [ test-wheel, build-sdist ]
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: wheels
          pattern: wheels-*
          merge-multiple: true

      - name: Publish package distributions to Test PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: wheels/
          skip-existing: true
          attestations: false

      - name: Publish package distributions to PyPI
        if: always()
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: wheels/
          skip-existing: true
