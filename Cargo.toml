[package]
name = "tantivy"
version = "0.27.0"
readme = "README.md"
authors = ["Damir Jelić <poljar@termina.org.uk>"]
edition = "2021"
license = "MIT"

[lib]
name = "tantivy"
crate-type = ["cdylib"]

[build-dependencies]
pyo3-build-config = "0.30.1"

[dependencies]
base64 = "0.23"
chrono = "0.4.44"
tantivy = { version = "0.27.0", features = ["zstd-compression"] }
tantivy-common = "0.27"
itertools = "0.15.0"
futures = "0.3.32"
pythonize = "0.29.0"
serde = "1.0"
serde_json = "1.0.150"

# Object storage support, enabled by the `cloud` feature (or one of `aws`,
# `gcp`, `azure` for a single provider). Off by default.
object_store = { version = "0.14.2", default-features = false, optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
url = { version = "2", optional = true }
# Used directly by the S3/GCS/Azure store setup; already in the tree via
# object_store, so these add nothing to the build.
http = { version = "1", optional = true }
reqwest = { version = "0.13", default-features = false, optional = true }

[features]
default = []
# Internal: the object-store directory with only the in-memory backend
# (`memory://`), used for tests. Enable `cloud` or a provider instead.
object-store = ["dep:object_store", "object_store/tokio", "dep:tokio", "dep:url"]
cloud-base = ["object-store", "dep:http"]
aws = ["cloud-base", "object_store/aws", "dep:reqwest"]
gcp = ["cloud-base", "object_store/gcp"]
azure = ["cloud-base", "object_store/azure"]
cloud = ["aws", "gcp", "azure"]

[dependencies.pyo3]
version = "0.29.0"
# abi3: one wheel per platform runs on every CPython >= 3.11, including future
# releases. Free-threaded interpreters (3.14t) have no stable ABI, and maturin
# falls back to a version-specific build for them.
features = ["abi3-py311", "chrono", "extension-module"]
