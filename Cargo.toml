[package]
name = "tantivy"
version = "0.26.2"
readme = "README.md"
authors = ["Damir Jelić <poljar@termina.org.uk>"]
edition = "2021"
license = "MIT"

[lib]
name = "tantivy"
crate-type = ["cdylib"]

[build-dependencies]
pyo3-build-config = "0.29.0"

[dependencies]
base64 = "0.22"
chrono = "0.4.44"
tantivy = "0.26.2"
tantivy-common = "0.11"
itertools = "0.15.0"
futures = "0.3.32"
pythonize = "0.29.0"
serde = "1.0"
serde_json = "1.0.150"

[dependencies.pyo3]
version = "0.29.0"
# abi3: one wheel per platform runs on every CPython >= 3.11, including future
# releases. Free-threaded interpreters (3.14t) have no stable ABI, and maturin
# falls back to a version-specific build for them.
features = ["abi3-py311", "chrono", "extension-module"]
